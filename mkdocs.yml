site_name: EvolveBench
site_description: >-
  A benchmark and execution harness for evaluating AI-driven algorithm
  discovery and codebase optimization systems on real GitHub repositories.
site_url: https://richardcsuwandi.github.io/evolvebench/
repo_url: https://github.com/richardcsuwandi/evolvebench
repo_name: richardcsuwandi/evolvebench
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tasks: tasks.md
  - Leaderboard: leaderboard.md
  - Contributing: contributing.md
  - License: license.md

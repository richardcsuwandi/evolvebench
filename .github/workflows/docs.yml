name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "registry.json"
      - "tasks/**/task.yaml"
      - "scripts/generate_docs.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: pip install -e ".[docs]" pyyaml

      - name: Regenerate tasks page from registry
        run: python scripts/generate_docs.py

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

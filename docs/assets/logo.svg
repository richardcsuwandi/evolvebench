<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">EvolveBench</title>
  <desc id="desc">A common root branching into several evolved candidates, with the tallest, brightest branch marked as the one the benchmark selected.</desc>

  <defs>
    <linearGradient id="gWinner" x1="64" y1="106" x2="98" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#153A7A"/>
      <stop offset="100%" stop-color="#4FA8FF"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round">
    <!-- baseline program -->
    <path d="M64,122 L64,106" stroke="#153A7A" stroke-width="12"/>
    <!-- pruned candidates -->
    <path d="M64,106 C50,96 34,90 26,70" stroke="#1E6BD6" stroke-width="9" opacity="0.3"/>
    <path d="M64,106 C58,80 52,58 48,38" stroke="#1E6BD6" stroke-width="9" opacity="0.5"/>
    <!-- selected candidate -->
    <path d="M64,106 C78,86 92,58 98,28" stroke="url(#gWinner)" stroke-width="11"/>
  </g>

  <!-- root: the baseline program every candidate evolves from -->
  <circle cx="64" cy="106" r="9" fill="#153A7A"/>
  <!-- pruned candidate outcomes -->
  <circle cx="26" cy="70" r="6" fill="#1E6BD6" opacity="0.38"/>
  <circle cx="48" cy="38" r="6" fill="#1E6BD6" opacity="0.58"/>
  <!-- benchmark score marking the winning candidate -->
  <circle cx="98" cy="28" r="8.5" fill="#F6B93B" stroke="#ffffff" stroke-width="2.5"/>
</svg>

[project]
name = "evolve-bench"
version = "0.1.0"
description = "Benchmark and execution harness for evaluating AI-driven algorithm discovery and codebase optimization systems on real GitHub repositories"
readme = "README.md"
authors = [
    { name = "Richard Cornelius Suwandi", email = "richardsuwandi@link.cuhk.edu.cn" },
]
requires-python = ">=3.8"
dependencies = [
    "openevolve>=0.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=1.5.0",
    "pyyaml>=6.0",
    "asyncio>=3.4.3",
]

[project.scripts]
evolve-bench = "evolve_bench.cli:app"
eb = "evolve_bench.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["evolve_bench*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

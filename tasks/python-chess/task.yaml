task_id: "python-chess"
description: "Optimize chess engine algorithms for improved performance"
repository: "https://github.com/niklasf/python-chess"
optimization_target: "chess-engine-optimization"
source_directory: "chess"

# Evaluation configuration
evaluation_criteria:
  correctness: 0.6
  performance: 0.4

required_metrics:
  - "correctness"
  - "performance"
  - "combined_score"

# Task metadata
category: "performance-optimization"
tags:
  - "chess"
  - "game"
  - "algorithm"
  - "performance"

# Baseline performance
baseline_metrics:
  correctness: 1.0
  performance: 0.3
  combined_score: 0.78

# Task-specific configuration
task_config:
  max_iterations: 30
  diff_based_evolution: true
  max_code_length: 50000
  language: "python"
  
  # LLM configuration
  llm_model: "google/gemini-2.5-flash"
  api_base: "https://openrouter.ai/api/v1"
  
  # Database configuration
  population_size: 300
  archive_size: 60
  feature_dimensions: ["correctness", "performance"]

# LLM Judge specific configuration
llm_judge_config:
  evaluation_criteria: "Evaluate chess engine optimization for correctness and performance. The evolved code should maintain game logic correctness while improving move calculation speed."
  scoring_rubric: "Score 0.0-1.0 for correctness (game logic accuracy) and performance (calculation speed). Consider both functional correctness and computational efficiency."
  task_context: "Python-chess engine optimization. The goal is to improve the performance of chess move generation and evaluation while maintaining correct game logic."
  llm_criteria:
    correctness: 0.6
    performance: 0.4
  json_format: '"correctness": <score>, "performance": <score>'

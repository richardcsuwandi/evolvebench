# EvolveBench config with Thompson Sampling + Novelty + Warmup Optimization
# Uses warmup phase to optimize prompt before main evolution

# General settings
max_iterations: 20
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

# Evolution settings
diff_based_evolution: true
max_code_length: 1000000

# Early stopping - disabled since we use warmup
early_stopping_enabled: false
early_stopping_patience: 10
early_stopping_min_iterations: 20
early_stopping_metric: combined_score
early_stopping_tolerance: 0.001

# LLM Configuration - Two models without weights enables Thompson sampling
llm:
  api_base: "https://openrouter.ai/api/v1"
  models:
    - name: "google/gemini-2.5-flash-lite"
      # No weight specified - defaults to 1.0, enables Thompson sampling
    - name: "google/gemini-2.5-flash"
      # No weight specified - defaults to 1.0, enables Thompson sampling

  # Thompson sampling parameters
  thompson_window_size: 50
  thompson_alpha_prior: 1.0
  thompson_beta_prior: 1.0
  thompson_min_samples: 2
  thompson_exploration_bonus: 0.0

  # Generation parameters
  temperature: 0.4
  max_tokens: 16000

  # Request parameters
  timeout: 150
  retries: 3

# Prompt configuration
prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true

# Database configuration
database:
  feature_dimensions: ['correctness', 'performance']
  feature_bins: 10

  population_size: 100
  archive_size: 20
  num_islands: 4

  elite_selection_ratio: 0.1
  exploration_ratio: 0.3
  exploitation_ratio: 0.6

  migration_interval: 20
  migration_rate: 0.1

# Evaluator configuration
evaluator:
  timeout: 200
  max_retries: 3
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.8]
  parallel_evaluations: 4

# Novelty detection settings
novelty:
  enabled: true
  embedding_backend: "local"
  embedding_model: "all-MiniLM-L6-v2"
  similarity_threshold: 0.95
  max_regeneration_attempts: 3
  temperature_increment: 0.15

# Prompt Evolution with Warmup Optimization
prompt_evolution:
  enabled: false  # Disable mid-evolution prompt evolution
  method: "feedback_descent"

  # WARMUP OPTIMIZATION - optimize prompt BEFORE main evolution
  warmup_optimize: true
  warmup_iterations: 3  # 3 FD iterations x 2 mini-exp x 5 iters = 30 warmup + 20 main = ~50 total

  # Feedback Descent settings (used by warmup)
  evolution_budget: 10
  mini_experiment_iterations: 5
  subprocess_timeout: 600
  frontier_size: 3
  max_feedback_history: 10
  editor_temperature: 0.7
  min_improvement_threshold: 0.01
  patience: 3

# Summary:
# - WARMUP: 3 FD iterations with mini-experiments to optimize starting prompt
# - Thompson Sampling for adaptive model selection
# - Novelty Detection to prevent duplicates
# - ~50 total iterations (30 warmup + 20 main)

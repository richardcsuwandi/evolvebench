# EvolveBench config with Thompson Sampling + Novelty Detection
# Based on evolvebench_with_novelty.yaml
# Uses 2 Gemini Flash models with Thompson sampling for adaptive model selection

# General settings
max_iterations: 20
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

# Evolution settings
diff_based_evolution: true
max_code_length: 1000000

# Early stopping configuration
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_iterations: 20
early_stopping_metric: combined_score
early_stopping_tolerance: 0.001

# LLM Configuration - Two models without weights enables Thompson sampling
llm:
  api_base: "https://openrouter.ai/api/v1"
  models:
    - name: "google/gemini-2.5-flash-lite"
      # No weight specified - defaults to 1.0, enables Thompson sampling
    - name: "google/gemini-2.5-flash"
      # No weight specified - defaults to 1.0, enables Thompson sampling

  # Thompson sampling parameters - optimized for EvolveBench (20 iterations)
  # Use original window size to allow proper convergence, minimal forced exploration
  thompson_window_size: 50        # Original window size for stable learning
  thompson_alpha_prior: 1.0       # Beta distribution prior (uniform start)
  thompson_beta_prior: 1.0
  thompson_min_samples: 2         # Minimal round-robin, then let Thompson decide
  thompson_exploration_bonus: 0.0 # Let natural Thompson sampling handle exploration

  # Generation parameters
  temperature: 0.4
  max_tokens: 16000

  # Request parameters
  timeout: 150
  retries: 3

# Prompt configuration
prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true

# Database configuration
database:
  # Use task-specific feature dimensions for MAP-Elites
  feature_dimensions: ['correctness', 'performance']
  feature_bins: 10

  # Population settings
  population_size: 100
  archive_size: 20
  num_islands: 4

  # Selection parameters
  elite_selection_ratio: 0.1
  exploration_ratio: 0.3
  exploitation_ratio: 0.6

  # Migration parameters
  migration_interval: 20
  migration_rate: 0.1

# Evaluator configuration
evaluator:
  # General settings
  timeout: 200
  max_retries: 3

  # Cascade evaluation for efficiency
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.8]

  # Parallel evaluation
  parallel_evaluations: 4

# Novelty detection settings (ENABLED)
novelty:
  enabled: true
  embedding_backend: "local"
  embedding_model: "all-MiniLM-L6-v2"
  similarity_threshold: 0.95
  max_regeneration_attempts: 3
  temperature_increment: 0.15

# Summary of configuration:
# - Thompson Sampling: Adaptive model selection based on performance
#   * gemini-2.5-flash-lite: Fast, cost-effective
#   * gemini-2.5-flash: Balanced speed/quality
# - Tuned config for EvolveBench:
#   * window_size=50: Original size for stable learning and convergence
#   * min_samples=2: Quick initial evaluation, then natural Thompson sampling
#   * exploration_bonus=0.0: Allow natural exploitation of better models
# - Models compete based on combined_score rewards
# - Novelty Detection: Prevent duplicate evaluations

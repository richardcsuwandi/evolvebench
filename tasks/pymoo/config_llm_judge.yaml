# Template for LLM-as-a-Judge Configuration
# This config uses LLM to directly judge evolved code quality

# General settings
max_iterations: 40
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

# Evolution settings
diff_based_evolution: true
max_code_length: 60000
language: "python"

# Early stopping configuration
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_iterations: 20
early_stopping_metric: combined_score
early_stopping_tolerance: 0.001

# LLM configuration
llm:
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  
  # API configuration
  api_base: "https://openrouter.ai/api/v1"
  
  # Generation parameters
  temperature: 0.4
  max_tokens: 16000
  
  # Request parameters
  timeout: 150
  retries: 3

# Prompt configuration
prompt:
  template_dir: null  # Use default templates
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true

# Database configuration
database:
  # Use LLM criteria as feature dimensions for MAP-Elites
  feature_dimensions: ['correctness', 'performance']
  feature_bins: 10
  
  # Population settings
  population_size: 120
  archive_size: 25
  num_islands: 4
  
  # Selection parameters
  elite_selection_ratio: 0.1
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  
  # Migration parameters
  migration_interval: 20
  migration_rate: 0.1

# Evaluator configuration
evaluator:
  # General settings
  timeout: 200
  max_retries: 3
  
  # Parallel evaluation
  parallel_evaluations: 4
  
  # LLM-only evaluation criteria and weights
  llm_criteria: {'correctness': 0.6, 'performance': 0.4}
  
  # Custom evaluation prompt for judging code quality
  llm_evaluation_prompt: |
    Evaluate the following evolved code for the task: Optimize non-dominated sorting in pymoo to improve performance (especially bi-objective) while preserving correctness of Pareto fronts.
    
    TASK CONTEXT: pymoo non-dominated sorting optimization with emphasis on bi-objective O(N log N) improvements while preserving exact fronts.
    OPTIMIZATION GOAL: Improve performance-non-dominated-sorting performance
    
    Evaluate non-dominated sorting optimization for correctness (same fronts) and performance (runtime speedup).
    
    Code to evaluate:
    ```
    {program_code}
    ```
    
    Return ONLY a valid JSON object (no markdown, no code blocks, no explanations) with numerical scores between 0.0 and 1.0 for each criterion.
    
    REQUIRED JSON FORMAT (copy this exact structure and fill in act scores):
    {{
      "correctness": <score>, "performance": <score>
    }}
    
    CRITICAL REQUIREMENTS:
    - Return ONLY the JSON object, nothing else
    - All scores must be numbers between 0.0 (worst) and 1.0 (best)
    - Include ALL required criteria: "correctness": <score>, "performance": <score>
    - Do NOT wrap in markdown code blocks (```json or ```)
    - Do NOT add any explanation or text before or after the JSON
    
    Be objective and precise. Consider the code's correctness, performance, and quality.
  
  # Cascade evaluation disabled for LLM-only mode (single evaluation stage)
  cascade_evaluation: false

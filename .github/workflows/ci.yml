name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # eb test only checks that this variable is present, no live API calls are made.
      OPENAI_API_KEY: dummy-ci-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Validate registry and task structure
        run: eb test

      - name: Compile check
        run: python -m compileall -q evolve_bench scripts

      - name: Black formatting check
        run: black --check evolve_bench scripts

      - name: Flake8 lint
        run: flake8 evolve_bench scripts

# Template for Hand-written Evaluator Configuration
# This config uses manually crafted evaluator.py files

# General settings
max_iterations: {max_iterations}
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

# Evolution settings
diff_based_evolution: {diff_based_evolution}
max_code_length: {max_code_length}

# Early stopping configuration
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_iterations: 20
early_stopping_metric: combined_score
early_stopping_tolerance: 0.001

# LLM configuration
llm:
  models:
    - name: "{llm_model}"
      weight: 1.0
  
  # API configuration
  api_base: "{api_base}"
  
  # Generation parameters
  temperature: 0.4
  max_tokens: 16000
  
  # Request parameters
  timeout: 150
  retries: 3

# Prompt configuration
prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true

# Database configuration
database:
  # Use task-specific feature dimensions for MAP-Elites
  feature_dimensions: {feature_dimensions}
  feature_bins: 10
  
  # Population settings
  population_size: {population_size}
  archive_size: {archive_size}
  num_islands: 4
  
  # Selection parameters
  elite_selection_ratio: 0.1
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  
  # Migration parameters
  migration_interval: 20
  migration_rate: 0.1

# Evaluator configuration
evaluator:
  # General settings
  timeout: 200
  max_retries: 3
  
  # Cascade evaluation for efficiency
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.8]

  # Parallel evaluation
  parallel_evaluations: 4

# Template for LLM-as-a-Judge Configuration
# This config uses LLM to directly judge evolved code quality

# General settings
max_iterations: 30
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

# Evolution settings
diff_based_evolution: true
max_code_length: 50000
language: "python"

# Early stopping configuration
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_iterations: 20
early_stopping_metric: combined_score
early_stopping_tolerance: 0.001

# LLM configuration
llm:
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  
  # API configuration
  api_base: "https://openrouter.ai/api/v1"
  
  # Generation parameters
  temperature: 0.4
  max_tokens: 16000
  
  # Request parameters
  timeout: 150
  retries: 3

# Prompt configuration
prompt:
  template_dir: null  # Use default templates
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true

# Database configuration
database:
  # Use LLM criteria as feature dimensions for MAP-Elites
  feature_dimensions: ['correctness', 'performance']
  feature_bins: 10
  
  # Population settings
  population_size: 300
  archive_size: 60
  num_islands: 4
  
  # Selection parameters
  elite_selection_ratio: 0.1
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  
  # Migration parameters
  migration_interval: 20
  migration_rate: 0.1

# Evaluator configuration
evaluator:
  # General settings
  timeout: 200
  max_retries: 3
  
  # Parallel evaluation
  parallel_evaluations: 4
  
  # LLM-only evaluation criteria and weights
  llm_criteria: {'correctness': 0.6, 'performance': 0.4}
  
  # Custom evaluation prompt for judging code quality
  llm_evaluation_prompt: |
    Evaluate the following evolved code for the task: Optimize chess engine algorithms for improved performance
    
    TASK CONTEXT: Python-chess engine optimization. The goal is to improve the performance of chess move generation and evaluation while maintaining correct game logic.
    OPTIMIZATION GOAL: Improve chess-engine-optimization performance
    
    Evaluate chess engine optimization for correctness and performance. The evolved code should maintain game logic correctness while improving move calculation speed.
    
    Evaluation criteria:
    {criteria}
    
    Code to evaluate:
    ```
    {program_code}
    ```
    
    Return ONLY a JSON object with numerical scores for each criterion:
    {{
      "correctness": <score>, "performance": <score>
    }}
    
    Be objective and precise. Consider the code's correctness, performance, and quality.
  
  # Cascade evaluation disabled for LLM-only mode (single evaluation stage)
  cascade_evaluation: false

# Template for LLM-Generated Evaluator Configuration
# This config enables OpenEvolve to dynamically generate evaluators using LLM

# General settings
max_iterations: 50
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

# Evolution settings
diff_based_evolution: true
max_code_length: 50000
language: "python"

# Early stopping configuration
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_iterations: 20
early_stopping_metric: combined_score
early_stopping_tolerance: 0.001

# LLM configuration
llm:
  models:
    - name: "google/gemini-2.5-flash-preview-09-2025"
      weight: 1.0

  # API configuration
  api_base: "https://openrouter.ai/api/v1"

  # Generation parameters
  temperature: 0.6
  max_tokens: 16000

  # Request parameters
  timeout: 300
  retries: 3

# Prompt configuration
prompt:
  template_dir: null  # Use default templates
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true

  # System message for LLM-generated evaluator creation
  system_message: |
    You are an expert in code evaluation and optimization. Your task is to create a Python evaluator function for the following optimization task:

    TASK DESCRIPTION: Optimize python-jsonschema equality checking functions (_mapping_equal, _sequence_equal, equal) to address Python 3.12 performance regression by reducing isinstance overhead and improving type-aware dispatch

    OPTIMIZATION GOAL: Improve equality-checking-performance

    EVALUATION CRITERIA: Evaluate python-jsonschema equality checking optimization for correctness and performance. The evolved code must preserve JSON Schema semantics (False != 0, True != 1) while reducing isinstance overhead and improving type-aware dispatch to address Python 3.12 regression.

    The evaluator function should:
    1. Take evolved code as input and return a dictionary with metrics
    2. Test correctness of the evolved code (especially bool/int distinction: False != 0, True != 1)
    3. Measure performance improvements on deeply nested structures
    4. Return scores between 0.0 and 1.0 for each metric
    5. Include a 'combined_score' that represents overall fitness (70% correctness, 30% performance)

    Required metrics: ['correctness', 'performance', 'combined_score']

    Return ONLY a complete Python evaluator function that can be executed directly.
    The function should be named 'evaluate' and take a single parameter 'code' (string).

# Database configuration
database:
  # Use task-specific feature dimensions for MAP-Elites
  feature_dimensions: ['correctness', 'performance']
  feature_bins: 10

  # Population settings
  population_size: 120
  archive_size: 25
  num_islands: 4

  # Selection parameters
  elite_selection_ratio: 0.1
  exploration_ratio: 0.3
  exploitation_ratio: 0.6

  # Migration parameters
  migration_interval: 20
  migration_rate: 0.1

# Evaluator configuration
evaluator:
  # General settings
  timeout: 300
  max_retries: 3

  # LLM evaluator generation
  llm_generate_evaluator: true  # Enable dynamic evaluator generation

  # LLM models for evaluator generation
  models:
  - name: "anthropic/claude-sonnet-4.5"
    weight: 1.0

  # Cascade evaluation for efficiency
  cascade_evaluation: false

  # Parallel evaluation
  parallel_evaluations: 4

task_id: "pandas_rolling_rank"
description: "Optimize pandas rolling_rank from O(n log w) C skiplist to O(n·w) Numba JIT for small windows, discovering that constant factors trump asymptotic complexity"
repository: "https://github.com/pandas-dev/pandas"
optimization_target: "rolling-rank-small-windows"
source_directory: "."
evolve_source: "pandas_rolling_rank.py"

# Evaluation configuration
evaluation_criteria:
  correctness: 0.7
  performance: 0.3

required_metrics:
  - "correctness"
  - "performance"
  - "combined_score"

# Task metadata
category: "performance-optimization"
tags:
  - "pandas"
  - "rolling-rank"
  - "jit-compilation"
  - "numba"
  - "constant-factors"
  - "counter-intuitive-optimization"

# Baseline performance (from pandas default C skiplist)
baseline_metrics:
  correctness: 1.0
  performance: 1.0  # pandas is the baseline
  combined_score: 1.0

# Task-specific configuration
task_config:
  max_iterations: 50
  diff_based_evolution: false
  max_code_length: 50000
  language: "python"

  # LLM configuration
  llm_model: "google/gemini-2.5-pro"
  api_base: "https://openrouter.ai/api/v1"

  # Database configuration
  population_size: 100
  archive_size: 20
  feature_dimensions: ["correctness", "performance"]

# LLM Generated Evaluator specific configuration
llm_evaluator_generation_model: "anthropic/claude-sonnet-4.5"

# LLM Judge specific configuration
llm_judge_config:
  evaluation_criteria: "Evaluate pandas rolling_rank optimization for correctness and performance. The evolved code should maintain 100% correctness while achieving 2-3x speedup over pandas for small window sizes (w < 300)."
  scoring_rubric: "Score 0.0-1.0 for correctness and performance. Correctness requires exact match with pandas output (NaN handling, tie-breaking methods, percentile mode). Performance measured as speedup ratio over pandas baseline."
  task_context: "Pandas rolling_rank optimization. The goal is to discover that Numba JIT compilation with O(n·w) complexity can outperform pandas' C skiplist O(n log w) for typical window sizes due to lower constant factors."
  llm_criteria:
    correctness: 0.7
    performance: 0.3
  json_format: '"correctness": <score>, "performance": <score>'

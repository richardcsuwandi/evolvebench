# Template for LLM-Generated Evaluator Configuration
# This config enables OpenEvolve to dynamically generate evaluators using LLM

# General settings
max_iterations: {max_iterations}
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

# Evolution settings
diff_based_evolution: {diff_based_evolution}
max_code_length: {max_code_length}
language: "{language}"

# Early stopping configuration
early_stopping_enabled: true
early_stopping_patience: 10
early_stopping_min_iterations: 20
early_stopping_metric: combined_score
early_stopping_tolerance: 0.001

# LLM configuration
llm:
  models:
    - name: "{llm_model}"
      weight: 1.0
  
  # API configuration
  api_base: "{api_base}"
  
  # Generation parameters
  temperature: 0.4
  max_tokens: 16000
  
  # Request parameters
  timeout: 300
  retries: 3

# Prompt configuration
prompt:
  template_dir: null  # Use default templates
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true
  
  # System message for LLM-generated evaluator creation
  system_message: |
    You are an expert in code evaluation and optimization. Your task is to create a Python evaluator function for the following optimization task:

    TASK DESCRIPTION: {task_description}
    
    OPTIMIZATION GOAL: {optimization_goal}
    
    EVALUATION CRITERIA: {evaluation_criteria}
    
    The evaluator function should:
    1. Take evolved code as input and return a dictionary with metrics
    2. Test correctness of the evolved code
    3. Measure performance improvements
    4. Return scores between 0.0 and 1.0 for each metric
    5. Include a 'combined_score' that represents overall fitness
    
    Required metrics: {required_metrics}
    
    Return ONLY a complete Python evaluator function that can be executed directly.
    The function should be named 'evaluate' and take a single parameter 'code' (string).

# Database configuration
database:
  # Use task-specific feature dimensions for MAP-Elites
  feature_dimensions: {feature_dimensions}
  feature_bins: 10
  
  # Population settings
  population_size: {population_size}
  archive_size: {archive_size}
  num_islands: 4
  
  # Selection parameters
  elite_selection_ratio: 0.1
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  
  # Migration parameters
  migration_interval: 20
  migration_rate: 0.1

# Evaluator configuration
evaluator:
  # General settings
  timeout: 300
  max_retries: 3
  
  # LLM evaluator generation
  llm_generate_evaluator: true  # Enable dynamic evaluator generation

  # LLM models for evaluator generation
  models:
  - name: {llm_evaluator_generation_model}
    weight: 1.0

  # Cascade evaluation for efficiency
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.8]

  # Parallel evaluation
  parallel_evaluations: 4

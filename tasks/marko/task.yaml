task_id: "marko"
description: "Optimize nested loops in marko parser's parse_source method for improved performance"
repository: "https://github.com/frostming/marko"
optimization_target: "performance-nested-loops-parse-source"
source_directory: "marko"
evolve_source: "marko/source.py"

# Evaluation configuration
evaluation_criteria:
  correctness: 0.5
  performance: 0.5

required_metrics:
  - "correctness"
  - "performance"
  - "combined_score"

# Task metadata
category: "performance-optimization"
tags:
  - "markdown"
  - "parser"
  - "performance"
  - "nested-loops"

# Baseline performance
baseline_metrics:
  correctness: 1.0
  performance: 0.3
  combined_score: 0.65

# Task-specific configuration
task_config:
  max_iterations: 20
  diff_based_evolution: true
  max_code_length: 50000
  language: "python"
  
  # LLM configuration
  llm_model: "google/gemini-2.5-flash"
  api_base: "https://openrouter.ai/api/v1"
  
  # Database configuration
  population_size: 100
  archive_size: 20
  feature_dimensions: ["correctness", "performance"]

# LLM Judge specific configuration
llm_judge_config:
  evaluation_criteria: "Evaluate the parser's correctness and performance improvements. The evolved code should maintain parsing accuracy while significantly improving speed for nested markdown structures."
  scoring_rubric: "Score 0.0-1.0 for correctness (parsing accuracy) and performance (speed improvement). Consider both functional correctness and algorithmic efficiency."
  task_context: "Markdown parser optimization focusing on nested loop performance in the parse_source method. The goal is to reduce parsing time for complex markdown documents while maintaining 100% correctness."
  llm_criteria:
    correctness: 0.5
    performance: 0.5
  json_format: '"correctness": <score>, "performance": <score>'
